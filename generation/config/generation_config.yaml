# Sinhala AI-text generation config
# Shared by the whole team — each member runs `generate.py --domain <d> --model <m>`
# for the domain x model combination they've claimed on the tracking sheet.
#
# Scope note: this config targets binary classification (Task 1) only. Mode B
# (continuation, mixed human/AI documents) is out of scope for now — it exists solely
# to feed Task 2 (boundary detection), which isn't being built yet.

seed: 42  # fixed seed so source-item sampling is deterministic and identical across resumed runs

pilot:
  samples_per_domain: 2  # random source items sampled per domain in run_pilot.py; each one is
                          # run through every mode x prompt-variant template for that domain

# Every model is called through OpenRouter's chat/completions API (see call_openrouter()
# in generate.py). model_id is an OpenRouter model slug (e.g. "google/gemini-2.5-pro").
# Needs OPENROUTER_API_KEY set in .env.
#
# Substitutes for the originally-requested Gemini 1.5 Pro (deprecated) and "DeepSeek
# first version" (never offered on OpenRouter — V3 is the earliest available).
#
# Open-weights slot history: Mistral-Nemo-Instruct and Llama-3.1-8B-Instruct were both
# piloted and rejected — both degenerated into repetition loops / English code-switching
# under this project's long constraint-heavy Sinhala prompts, despite scoring well on
# Unicode Sinhala perplexity in arXiv:2601.14958 (a base-model metric that doesn't predict
# instruct-following robustness). Gemma-4-31B-IT (released after that paper) piloted clean
# but was later dropped from the roster in favor of GPT-4o.
models:
  gemini-2.5-pro: google/gemini-2.5-pro
  deepseek-v3: deepseek/deepseek-chat
  gpt-4o: openai/gpt-4o

# samples_per_model is how many of this domain's source items EACH model draws. The three
# models draw disjoint (non-overlapping) slices of the shuffled source pool, so
# total_source_items (= samples_per_model x number of models) must be available in the
# source file after filtering — allocation.py asserts this and fails loudly otherwise.
# total_source_items is documentation/an assertion target, not read for slicing itself.
#
# Each mode's "count" below is the number of unique source items sampled for that mode,
# per model; the counts under a domain must sum to that domain's samples_per_model —
# generate.py and run_pilot.py should assert this on startup and fail loudly if a config
# edit breaks the sum.
#
# "num_variants" must equal the number of prompt strings listed for that mode in the
# prompts section below — generate.py asserts this too, so an edit to one without the
# other fails fast instead of silently using the wrong variant count.
domains:
  news:
    source_file: source_data/nsina/news.json
    total_source_items: 1500
    samples_per_model: 500
    min_words: 40  # source-quality floor for filtering.py — also gates the
                    # encoding-corruption/insufficient-Sinhala checks; see filtering.py
    modes:
      mode_a:            # title -> full article (open-ended)
        count: 200
        num_variants: 2
      mode_b:             # paraphrase/rewrite of the full human article
        count: 300
        num_variants: 2

  wikipedia:
    # wikipedia_dated.parquet = wikipedia.parquet + created_date/last_modified_date,
    # fetched from the MediaWiki API by build_wikipedia_dated_dataset.py (the raw dump
    # carries no timestamps at all). Needed for max_date below.
    source_file: source_data/wikipedia-monthly/wikipedia_dated.parquet
    total_source_items: 1500
    samples_per_model: 500
    min_words: 100  # source-quality floor for wikipedia_quality_filter.py; Wikipedia articles need more
                     # substance than shorter domains like social_media, which doesn't set this
    max_date: "2022-11-30"  # ChatGPT's public launch — only use articles created AND last-edited
                             # before this, so the "human" side of the dataset predates mass
                             # LLM-assisted editing. See GPT_ERA_CUTOFF in wikipedia_quality_filter.py.
    modes:
      mode_a:            # title -> full article (open-ended)
        count: 200
        num_variants: 2
      mode_b:             # paraphrase of the full human article
        count: 300
        num_variants: 2

  social_media:
    source_file: source_data/facebookdecadecorpora/facebook.csv
    total_source_items: 1500
    samples_per_model: 500
    min_words: 15  # source-quality floor for filtering.py — also gates the
                    # encoding-corruption/insufficient-Sinhala checks; see filtering.py
    modes:
      mode_b:             # paraphrase of caption — only mode used, no title field to condition on
        count: 500
        num_variants: 2

# Prompt templates, nested by domain then mode. Each mode holds a LIST of variant
# templates (index 0, 1, 2, ...) so run_pilot.py can test alternate phrasings side by
# side before the team commits to one. generate.py always uses variant index 0 for
# full-scale production runs — once the pilot identifies a winning phrasing for a
# mode, move it to index 0 here.
#
# Available placeholders (use only the ones relevant to each mode):
#   {title} {human_text} {caption} {human_prefix} {min_word_count} {max_word_count}
prompts:
  news:
    mode_a:
      - "පහත සිරැසිය සඳහා පුවත්පත් ලිපියක් සිංහලෙන් ලියන්න. එය වචන {min_word_count}ත් {max_word_count}ත් අතර දිගකින් යුක්ත විය යුතුය. ලිපියේ ශරීරය පමණක් ලියන්න — සිරැසිය නැවත සඳහන් නොකරන්න, කර්තෘගේ නම, මාධ්‍ය ආයතනය, හෝ මෙය AI විසින් ජනනය කළ බවට කිසිදු සටහනක් එකතු නොකරන්න. සම්පූර්ණයෙන්ම සිංහල භාෂාවෙන් ලියන්න — වෙනත් භාෂාවක වචන හෝ අකුරු මිශ්‍ර නොකරන්න. **වැදගත්:** සිරැසියට අදාළ නොවන වෙනස් සිද්ධියක්, අපරාධයක්, හෝ තත්ත්වයක් කිසිසේත් නිර්මාණය නොකරන්න — උදාහරණයක් ලෙස, සිරැසියේ 'මළ සිරුරක්' සඳහන් නම් එය 'තුවාල ලත් පුද්ගලයෙක්' බවට හෝ එකිනෙකට වෙනස් සිද්ධි වර්ගයක් බවට වෙනස් කරන්න එපා. සිරැසියෙන් ගම්‍ය වන සිද්ධියේ මූලික ස්වභාවයට (කුමන ආකාරයේ සිද්ධියක්ද යන්න) අනිවාර්යයෙන් අනුකූලව සිටින්න. මූලාශ්‍රයේ නොමැති කිසිදු නම, තනතුරු, ස්ථාන, දිනයන්, සංඛ්‍යාලේඛන, හෝ කරුණක් නිර්මාණය නොකරන්න — සිරැසියේ සඳහන් වන නම්, තනතුරු, සහ සංඛ්‍යා ඇත්නම් ඒවා නිවැරදිව හා නිශ්චිතවම භාවිත කරන්න, කිසිසේත් වෙනස් නොකරන්න හෝ අනුමාන නොකරන්න. යම් විස්තරයක් සිරැසියේ නොමැති නම්, එය පොදුවේ හෝ අපැහැදිලිව සඳහන් කරන්න — නිශ්චිත නමක් හෝ සංඛ්‍යාවක් අනුමාන කර ලියන්න එපා. Markdown සලකුණු, මාතෘකා, උප-මාතෘකා, ලැයිස්තු හෝ උධෘත සලකුණු භාවිත නොකරන්න — සරල ගද්‍ය ඡේද පමණක් ලියන්න. සිරැසිය: {title}"
      - "{title} යන පුවත පිළිබඳ වාර්තාවක්, වෘත්තීය මාධ්‍යවේදියෙකුගේ ශෛලියෙන් ලියන්න — එනම් උදාසීන, තථ්‍යමය, හා සරල භාෂාවෙන්, සත්‍ය පුවත්පත් වාර්තාවකට ගැලපෙන පරිදි, වචන {min_word_count}ත් {max_word_count}ත් අතර. කාව්‍යමය, උපමා, හෝ අනවශ්‍ය හැඟීම්බර/විස්තරාත්මක වචන භාවිත නොකරන්න. ලිපියේ ශරීරය පමණක් ලියන්න — සිරැසිය, කර්තෘගේ නම, මාධ්‍ය ආයතනය, හෝ අමතර සටහන් එකතු නොකරන්න. සම්පූර්ණයෙන්ම සිංහල භාෂාවෙන් ලියන්න — වෙනත් භාෂාවක වචන මිශ්‍ර නොකරන්න. **වැදගත්:** සිරැසියට අදාළ නොවන වෙනස් සිද්ධියක් හෝ අපරාධයක් කිසිසේත් නිර්මාණය නොකරන්න — සිරැසියෙන් ගම්‍ය වන සිද්ධියේ මූලික ස්වභාවයට අනිවාර්යයෙන් අනුකූලව සිටින්න. මූලාශ්‍රයේ නොමැති කිසිදු නම, තනතුරු, ස්ථාන, දිනයන්, සංඛ්‍යාලේඛන, හෝ කරුණක් නිර්මාණය නොකරන්න. යම් විස්තරයක් සිරැසියේ නොමැති නම්, එය පොදුවේ හෝ අපැහැදිලිව සඳහන් කරන්න. Markdown සලකුණු, මාතෘකා, උප-මාතෘකා හෝ ලැයිස්තු භාවිත නොකරන්න — සරල ගද්‍ය ඡේද පමණක් ලියන්න."
    mode_b:
      - "පහත පුවත්පත් ලිපිය එහි අර්ථය හා දළ දිග ආසන්න වශයෙන් පවත්වාගෙන, ඔබේම වචනවලින් නැවත ලියන්න. එහි සඳහන් සියලුම නම්, තනතුරු, ස්ථාන, දිනයන්, හා සංඛ්‍යාලේඛන හරියටම එලෙසින්ම නොවෙනස්ව රඳවා ගන්න — කිසිදු නමක්, තනතුරක්, හෝ සංඛ්‍යාවක් වෙනස් නොකරන්න, එකතු නොකරන්න, හෝ ඉවත් නොකරන්න. සම්පූර්ණයෙන්ම සිංහල භාෂාවෙන් ලියන්න — වෙනත් භාෂාවක වචන මිශ්‍ර නොකරන්න. Markdown සලකුණු, මාතෘකා, උප-මාතෘකා හෝ ලැයිස්තු භාවිත නොකරන්න, අමතර සටහන් හෝ පැහැදිලි කිරීම් එකතු නොකරන්න — සරල ගද්‍ය ඡේද පමණක් ලියන්න: {human_text}"
      - "පහත පුවත්පත් ලිපිය කෙටියෙන් හා සරලව නැවත ලියන්න, එහි ප්‍රධාන කරුණු හා දළ දිග වෙනස් නොකර. එහි සඳහන් සියලුම නම්, තනතුරු, ස්ථාන, දිනයන්, හා සංඛ්‍යාලේඛන හරියටම එලෙසින්ම නොවෙනස්ව රඳවා ගන්න — කිසිදු නමක්, තනතුරක්, හෝ සංඛ්‍යාවක් වෙනස් නොකරන්න, එකතු නොකරන්න, හෝ ඉවත් නොකරන්න. සම්පූර්ණයෙන්ම සිංහල භාෂාවෙන් ලියන්න — වෙනත් භාෂාවක වචන මිශ්‍ර නොකරන්න. Markdown සලකුණු හෝ ලැයිස්තු භාවිත නොකරන්න, සරල ගද්‍ය ඡේද පමණක් ලියන්න: {human_text}"
 
  wikipedia:
    mode_a:
      - "\"{title}\" යන මාතෘකාව සඳහා විශ්වකෝශ ලිපියක් සිංහලෙන් ලියන්න. එය වචන {min_word_count}ත් {max_word_count}ත් අතර දිගකින් යුක්ත විය යුතුය. ලිපියේ ශරීරය පමණක් ලියන්න — මාතෘකාව නැවත සඳහන් නොකරන්න, කර්තෘගේ නම හෝ මෙය AI විසින් ජනනය කළ බවට කිසිදු සටහනක් එකතු නොකරන්න. සම්පූර්ණයෙන්ම සිංහල භාෂාවෙන් ලියන්න — වෙනත් භාෂාවක වචන මිශ්‍ර නොකරන්න. උදාසීන හා විශ්වකෝශීය ස්වරයෙන් ලියන්න. **වැදගත්:** මෙම මාතෘකාව විශේෂිත සිදුවීමක්, තරගයක්, ප්‍රතිඵලයක්, හෝ සංඛ්‍යාලේඛනයක් සම්බන්ධ නම් — ජයග්‍රාහකයන්, නාම, දින, ලකුණු, හෝ ප්‍රතිඵල ඔබට තහවුරු කළ නොහැකි නම් ඒවා කිසිසේත් අනුමාන කර හෝ නිර්මාණය කර නොලියන්න. එවැනි නිශ්චිත තොරතුරු නොදන්නේ නම්, මාතෘකාව පිළිබඳ පොදු හා පොදු වශයෙන් සත්‍ය පසුබිම් තොරතුරු පමණක් ලියන්න (එනම් මාතෘකාවේ ස්වභාවය, එය අයත් ක්ෂේත්‍රය, පොදු සන්දර්භය), විශේෂිත ප්‍රතිඵල හෝ නම් නිර්මාණය නොකර. Markdown සලකුණු (#, **, -, වගු ආදිය), මාතෘකා, උප-මාතෘකා, ලැයිස්තු, හෝ වගු භාවිත නොකරන්න — සරල ගද්‍ය ඡේද පමණක් ලියන්න. මාතෘකාව: {title}"
      - "\"{title}\" මාතෘකාව සාමාන්‍ය පාඨකයෙකුට තේරුම් ගත හැකි සරල ආකාරයෙන් විස්තර කරන්න. එය වචන {min_word_count}ත් {max_word_count}ත් අතර දිගකින් යුක්ත විය යුතුය. ලිපියේ ශරීරය පමණක් ලියන්න — මාතෘකාව නැවත සඳහන් නොකරන්න, කර්තෘගේ නම හෝ අමතර සටහන් එකතු නොකරන්න. සම්පූර්ණයෙන්ම සිංහල භාෂාවෙන් ලියන්න — වෙනත් භාෂාවක වචන මිශ්‍ර නොකරන්න. උදාසීන හා විශ්වකෝශීය ස්වරයෙන් ලියන්න. **වැදගත්:** මෙම මාතෘකාව විශේෂිත සිදුවීමක්, තරගයක්, ප්‍රතිඵලයක්, හෝ සංඛ්‍යාලේඛනයක් සම්බන්ධ නම් — ජයග්‍රාහකයන්, නාම, දින, ලකුණු, හෝ ප්‍රතිඵල ඔබට තහවුරු කළ නොහැකි නම් ඒවා කිසිසේත් අනුමාන කර හෝ නිර්මාණය කර නොලියන්න; පොදු පසුබිම් තොරතුරු පමණක් ලියන්න. Markdown සලකුණු, මාතෘකා, උප-මාතෘකා, ලැයිස්තු, හෝ වගු භාවිත නොකරන්න — සරල ගද්‍ය ඡේද පමණක් ලියන්න."
    mode_b:
      - "පහත විශ්වකෝශ ලිපිය එහි අර්ථය සුරකින්ම, ඔබේම වචනවලින් නැවත ලියන්න. එහි සඳහන් සියලුම නම්, දිනයන්, ස්ථාන, හා සංඛ්‍යාලේඛන හරියටම එලෙසින්ම නොවෙනස්ව රඳවා ගන්න — කිසිවක් වෙනස් නොකරන්න, එකතු නොකරන්න, හෝ ඉවත් නොකරන්න. මූලාශ්‍රයේ ඇති \"thumb\", \"right\", \"link=\", රූප ගොනු නාම, හෝ වෙනත් තාක්ෂණික/ආකෘති කේත වැනි දෑ මුළුමනින්ම නොසලකා හරින්න — ඒවා ලිපියේ අන්තර්ගතය නොවන බැවින් ප්‍රතිනිෂ්පාදනය නොකරන්න. සම්පූර්ණයෙන්ම සිංහල භාෂාවෙන් ලියන්න — වෙනත් භාෂාවක වචන මිශ්‍ර නොකරන්න. Markdown සලකුණු, මාතෘකා, උප-මාතෘකා, ලැයිස්තු, හෝ වගු භාවිත නොකරන්න, අමතර සටහන් හෝ පැහැදිලි කිරීම් එකතු නොකරන්න — සරල ගද්‍ය ඡේද පමණක් ලියන්න: {human_text}"
      - "පහත විශ්වකෝශ ලිපිය සාමාන්‍ය පාඨකයෙකුට වඩාත් තේරුම් ගත හැකි ආකාරයෙන් නැවත ලියන්න. එහි සඳහන් සියලුම නම්, දිනයන්, ස්ථාන, හා සංඛ්‍යාලේඛන හරියටම එලෙසින්ම නොවෙනස්ව රඳවා ගන්න. මූලාශ්‍රයේ ඇති \"thumb\", \"right\", \"link=\", රූප ගොනු නාම, හෝ වෙනත් තාක්ෂණික/ආකෘති කේත වැනි දෑ මුළුමනින්ම නොසලකා හරින්න. සම්පූර්ණයෙන්ම සිංහල භාෂාවෙන් ලියන්න — වෙනත් භාෂාවක වචන මිශ්‍ර නොකරන්න. Markdown සලකුණු, ලැයිස්තු, හෝ වගු භාවිත නොකරන්න — සරල ගද්‍ය ඡේද පමණක් ලියන්න: {human_text}"

