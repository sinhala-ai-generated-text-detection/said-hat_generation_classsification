    mode_b:
      - "පහත සමාජ මාධ්‍ය සටහන එහි අර්ථය හා දළ දිග ආසන්න වශයෙන් පවත්වාගෙන, වෙනස් වචනවලින් නැවත ලියන්න. සටහන කෙටි වුවද, එය ප්‍රතික්ෂේප නොකර හෝ අමතර විස්තර/අර්ථයන් එකතු නොකර, එහිම කෙටි බව පවත්වාගෙන නැවත ලියන්න. සටහන අවිධිමත් හෝ කථන-ශෛලියේ වුවද, එය ඒ අයුරින්ම පාහේ පිටපත් නොකරන්න — වචන තේරීම හා වාක්‍ය ව්‍යුහය සැලකිය යුතු ලෙස වෙනස් කරමින්, සැබවින්ම නැවත ලියන්න, සුළු වෙනස්කම් කිහිපයක් පමණක් නොකරන්න. එකම එක් version එකක් පමණක් ලියන්න — විකල්ප කිහිපයක්, විවිධ ශෛලීන්, හෝ ඔබ තෝරාගැනීමට ඉඩ දෙන පිළිතුරු කිසිවක් ලබා නොදෙන්න. එහි සඳහන් සියලුම නම්, ස්ථාන, දිනයන්, හෑෂ්ටැග්, හෝ සංඛ්‍යා නිවැරදිව හා නොවෙනස්ව රඳවා ගන්න. සමාජ මාධ්‍ය සටහනකට ගැලපෙන අවිධිමත් ස්වරය පවත්වාගන්න. සම්පූර්ණයෙන්ම සිංහල භාෂාවෙන් ලියන්න — වෙනත් භාෂාවක වචන මිශ්‍ර නොකරන්න, විකෘත හෝ තේරුම්ගත නොහැකි වචන භාවිත නොකරන්න. Markdown හෝ ආකෘතිකරණ සලකුණු කිසිවක් භාවිත නොකරන්න — මාතෘකා, තද අකුරු, ඇල අකුරු, ලැයිස්තු, උධෘත සලකුණු, තිරස් රේඛා, කේත කොටස්, හෝ සබැඳි ඇතුළුව. නැවත ලියූ සටහන පමණක්, කිසිදු අමතර වචනයකින් තොරව ලියන්න: {caption}"
      - "මේ සටහන වෙනත් කෙනෙක් ලියනවා වගේ, එහි අර්ථය හා දළ දිග වෙනස් නොකර වචන වෙනස් කරලා නැවත ලියන්න. සටහන කෙටි වුවද, එය ප්‍රතික්ෂේප නොකර හෝ අමතර විස්තර/අර්ථයන් එකතු නොකර, එහිම කෙටි බව පවත්වාගෙන නැවත ලියන්න. සටහන අවිධිමත් හෝ කථන-ශෛලියේ වුවද, එය ඒ අයුරින්ම පාහේ පිටපත් නොකරන්න — වචන තේරීම හා වාක්‍ය ව්‍යුහය සැලකිය යුතු ලෙස වෙනස් කරමින්, සැබවින්ම වෙනත් කෙනෙක් ලියනවා වගේ නැවත ලියන්න, සුළු වෙනස්කම් කිහිපයක් පමණක් නොකරන්න. එකම එක් version එකක් පමණක් ලියන්න — විකල්ප කිහිපයක් හෝ පැහැදිලි කිරීම් ලබා නොදෙන්න. එහි සඳහන් සියලුම නම්, ස්ථාන, දිනයන්, හෑෂ්ටැග්, හෝ සංඛ්‍යා නිවැරදිව හා නොවෙනස්ව රඳවා ගන්න. සමාජ මාධ්‍ය සටහනකට ගැලපෙන අවිධිමත් ස්වරය පවත්වාගන්න. සම්පූර්ණයෙන්ම සිංහල භාෂාවෙන් ලියන්න — වෙනත් භාෂාවක වචන මිශ්‍ර නොකරන්න, විකෘත හෝ තේරුම්ගත නොහැකි වචන භාවිත නොකරන්න. Markdown හෝ ආකෘතිකරණ සලකුණු කිසිවක් භාවිත නොකරන්න — නැවත ලියූ සටහන පමණක් ලියන්න: {caption}"